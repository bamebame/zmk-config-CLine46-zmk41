#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

##for NiMH battery
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# optional
CONFIG_ZMK_NON_LIPO_MAX_MV=1360
CONFIG_ZMK_NON_LIPO_MIN_MV=1020
CONFIG_ZMK_NON_LIPO_LOW_MV=1000
#CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000
# 60 seconds

# ========================================
# BLE リンクの安定化 (zmk-config-Keyball44 と同じ設定に揃えたもの)
# ========================================
# 送信出力を +8dBm に。既定は 0dBm。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2M PHY を無効化する (この Kconfig の現在の効果はそれだけ:
#   config BT_CTLR_PHY_2M
#       default n if ZMK_BLE_EXPERIMENTAL_CONN
# 2M PHY は速い代わりに受信感度が 1M PHY より約 6dB 悪く、距離とノイズに弱い)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 送信バッファ。Zephyr の既定は ACL_TX=3 で、L2CAP_TX はそれに追従して 3。
# マウスレポートは高頻度なので、接続イベントを取りこぼすとすぐ溢れる。
CONFIG_BT_BUF_ACL_TX_COUNT=8
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
